# Drop-in: /etc/systemd/system/ollama.service.d/override.conf
# Depois: sudo systemctl daemon-reload && sudo systemctl restart ollama
# O `ollama` CLI local passa a precisar de OLLAMA_HOST=100.74.37.102:11434.
# ACL opcional da Tailscale: liberar so jessejamesserver nas portas 11434 e 8880.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
Environment="OLLAMA_HOST=100.74.37.102:11434"
Restart=on-failure
