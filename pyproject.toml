[project]
name = "falaai"
version = "0.1.0"
description = "Newsletters do Gmail viram um podcast diário em pt-BR, gerado em máquinas próprias."
requires-python = ">=3.12,<3.13"
dependencies = [
    "starlette",
    "uvicorn",
    "httpx",
    "google-api-python-client",
    "google-auth-oauthlib",
    "markdownify",
    "feedgen",
    "prometheus-client",
]

[project.optional-dependencies]
tts = ["kokoro>=0.9", "soundfile", "numpy"]

[project.scripts]
falaai = "falaai.cli:main"

[dependency-groups]
dev = ["pytest", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falaai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
