# Fatos levantados no servidor jessejamesserver (so leitura):
# - Sidecar: cada app tem um container tailscale/tailscale (ex.: dozzle_tailscale, hostname proprio,
#   TS_AUTHKEY do .env, TS_STATE_DIR=/var/lib/tailscale, TS_USERSPACE=false, /dev/net/tun,
#   cap NET_ADMIN e SYS_MODULE, healthcheck `pgrep tailscaled`) e o app usa
#   `network_mode: service:<sidecar>` com depends_on service_healthy.
# - O prometheus esta na rede Docker externa `medianet` (NETWORK_NAME=medianet no .env do servidor).
#   O sidecar entra nela, entao o Prometheus alcanca o app por `falaai_tailscale:8000`
#   (o app compartilha a pilha de rede do sidecar). Nao precisa passar pela tailnet.
# - prometheus.yml: /home/davi/my-servers-config/docker/server/prometheus/prometheus.yml (bind ro).
# - Grafana usa provisioning por arquivo em .../prometheus/grafana/provisioning/{alerting,datasources},
#   com contact point `discord` e DISCORD_WEBHOOK_URL no ambiente do Grafana.

services:
  ts-falaai:
    image: tailscale/tailscale:latest
    container_name: falaai_tailscale
    hostname: falaai
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # HTTPS na 443 da tailnet, como os outros serviços; o app continua em :8000 (Prometheus usa).
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./deploy/ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 2m
      timeout: 5s
      retries: 3
    networks:
      - media-network

  falaai:
    build: .
    image: falaai:latest
    container_name: falaai
    network_mode: service:ts-falaai
    depends_on:
      ts-falaai:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME:-medianet}
    external: true
